<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV - Hadley</title>
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    video {
      width: 100%;
      max-width: 800px;
      border-radius: 10px;
      display: block;
      margin: 0 auto 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .button:hover {
      opacity: 0.8;
    }
    
    footer {
      margin-top: 40px;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: #777;
    }

    footer a {
      color: #555;
      text-decoration: none;
      margin: 0 10px;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Hadley</h1>

    <p class="subtitle">Physicist & Developer</p>

    <video controls preload="metadata">
      <source src="presentation.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="buttons">
      <a class="button" href="CV.pdf" target="_blank">
        📄 View my CV
      </a>
    </div>

    <footer>
      <span>Hadley — Physicist & Developer</span>
      <br>
      <a href="mailto:ton-email@example.com">Email</a>
      <a href="https://www.linkedin.com/in/TON-PROFIL/" target="_blank">LinkedIn</a>
      <a href="https://github.com/Adlax" target="_blank">GitHub</a>
    </footer>

  </div>

</body>
</html>
